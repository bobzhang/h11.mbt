name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        moonbit: [latest, pre-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "${{ matrix.moonbit }}"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - name: moon check (warnings are errors)
        run: moon check --deny-warn --target all
      - name: moon fmt (no diff)
        run: moon fmt --check
      - name: Run supported-target tests
        run: moon test --target all --deny-warn
