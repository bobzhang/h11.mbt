name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        moonbit: [latest, pre-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "${{ matrix.moonbit }}"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - name: moon check (warnings are errors)
        run: moon check --deny-warn --target all
      - name: moon fmt (no diff)
        run: moon fmt --check
      # `moon check --deny-warn` above already rejects deprecated calls in
      # our sources and tests. Allow warning 20 (deprecated) here only because
      # moon's own generated test driver still calls deprecated core APIs
      # (`StringBuilder(size_hint=)`, `to_unchecked_string(length=)`) on the
      # 2026-11-17 pre-release.
      - name: Run supported-target tests
        run: moon test --target all --deny-warn --warn-list -20
